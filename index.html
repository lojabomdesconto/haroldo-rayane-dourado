<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convite de Casamento</title>
  
  <!-- Fontes do Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <div class="card-container">
    
    <!-- Foto do Topo -->
    <div class="top-photo-wrapper">
      <img src="foto-topo.jpg" alt="Foto do Casal">
    </div>

    <!-- Conteúdo Central -->
    <main class="main-content">
      
      <div class="names-container">
        <img src="decoracao-esquerda.png" alt="" class="left-decoration">
        <h1 class="couple-names">
          Nome <span>&</span> Nome
        </h1>
      </div>

      <p class="invitation-text">
        Convidam para a celebração do seu casamento
      </p>

      <div class="location-info">
        <div class="divider-line"></div>
        <p class="location-text">Local do Evento</p>
        <div class="divider-line"></div>
      </div>

      <div class="date-wrapper">
        <img src="data-topo.png" alt="" class="date-deco date-deco-top">
        <div class="date-badge">15.11.2026</div>
        <img src="data-rodape.png" alt="" class="date-deco date-deco-bottom">
      </div>

      <p class="touch-instruction">Toque nas opções abaixo</p>

      <div class="interactive-buttons">
        <!-- Botão RSVP para abrir o modal -->
        <div class="btn-row" id="openRsvpBtn">
          <div class="icon-square">✉</div>
          <span class="btn-label">Confirmar Presença</span>
        </div>
      </div>

    </main>

    <!-- Foto Rodapé -->
    <div class="bottom-section">
      <div class="bottom-photo-wrapper">
        <img src="foto-rodape.jpg" alt="Casal">
        <div class="waiting-text">Esperamos você!</div>
      </div>
    </div>

  </div>

  <!-- MODAL RSVP -->
  <div id="rsvpModal" class="modal">
    <div class="modal-content">
      <h3>Confirmação de Presença</h3>
      <form id="rsvpForm">
        
        <div class="form-group">
          <label for="nome">Seu Nome Completo:</label>
          <input type="text" id="nome" placeholder="Digite seu nome completo" required>
        </div>
        
        <div class="form-group">
          <label for="presencaCelebracao">Celebração:</label>
          <select id="presencaCelebracao" required>
            <option value="Sim, estarei presente na Celebração">Sim, estarei presente na Celebração</option>
            <option value="Não poderei ir à Celebração">Não poderei ir à Celebração</option>
          </select>
        </div>

        <div class="form-group">
          <label for="presencaRecepcao">Recepção / Festa:</label>
          <select id="presencaRecepcao" required>
            <option value="Sim, estarei presente na Recepção">Sim, estarei presente na Recepção</option>
            <option value="Não poderei ir à Recepção">Não poderei ir à Recepção</option>
          </select>
        </div>

        <div class="form-group">
          <label for="acompanhantes">Quantidade de Acompanhantes:</label>
          <input type="number" id="acompanhantes" placeholder="0" min="0" value="0">
        </div>

        <button type="submit" class="modal-btn">Enviar via WhatsApp</button>
        <button type="button" class="modal-btn btn-cancel" id="closeRsvpBtn">Cancelar</button>
      </form>
    </div>
  </div>

  <!-- JavaScript Local -->
  <script src="./script.js"></script>
</body>
</html>
